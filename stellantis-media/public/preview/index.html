<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Preview – Stellantis Paris 2026 media</title>
<style>
  body { margin: 0; background: #fff; font-family: "Neue Plak", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: #0b1024; }
  header { display: flex; align-items: center; gap: 16px; padding: 18px 32px; border-bottom: 1px solid #e4e7f0; }
  header img { height: 26px; }
  header span { color: #5b6178; font-size: 14px; }
  main { max-width: 1200px; margin: 0 auto; padding: 40px 32px 80px; }
  h1 { font-size: 32px; margin: 0 0 28px; }
  @media (max-width: 767px) { main { padding: 24px 16px 60px; } header { padding: 14px 16px; } }
</style>
</head>
<body>
<header><img src="https://cdn.prod.website-files.com/6ab5f7c03bc1be2290997e01/6ab61d6550050578bb4b1052_stellantis-1.svg" alt="Stellantis"><span>Preview of the press kit media viewer</span></header>
<main>
  <h1 id="t"></h1>
  <div id="viewer"></div>
</main>
<script>
  var folder = new URLSearchParams(location.search).get("folder") || "";
  document.getElementById("t").textContent = folder.split("/").join(" / ");
  document.getElementById("viewer").setAttribute("data-stl-media", folder);
</script>
<script src="/viewer.js"></script>
</body>
</html>
