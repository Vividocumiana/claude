<!-- Stellantis Paris 2026 – cookie consent following the Stellantis "Cookie requirements" (banner, settings, 6-month expiry) -->
<style>
#stl-cc,#stl-cc *{box-sizing:border-box}
#stl-cc{position:fixed;inset:0;z-index:2147480000;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none;background:rgba(11,16,36,.28);font-family:var(--mainfont),-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#0b1024}
#stl-cc .cc-box{pointer-events:auto;position:relative;width:100%;max-width:640px;max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:16px;box-shadow:0 24px 64px rgba(11,16,36,.28);padding:28px 28px 24px}
#stl-cc h2{font-size:20px;line-height:1.3;margin:0 0 12px;font-weight:600;padding-right:200px}
#stl-cc p{font-size:14px;line-height:1.6;margin:0 0 10px;color:#4a4f63}
#stl-cc a{color:#243782;text-decoration:underline}
#stl-cc .cc-skip{position:absolute;top:22px;right:20px;display:flex;align-items:center;gap:6px;background:none;border:0;padding:6px 8px;border-radius:8px;font:inherit;font-size:13px;line-height:1;color:#243782;cursor:pointer;text-decoration:underline}
#stl-cc .cc-skip:hover{background:#eef0f8}
#stl-cc .cc-cats{margin:16px 0 4px;border-top:1px solid #e6e8f0}
#stl-cc .cc-cat{padding:14px 0;border-bottom:1px solid #e6e8f0}
#stl-cc .cc-cat label{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:#0b1024;cursor:pointer}
#stl-cc .cc-cat input{width:18px;height:18px;margin:0;accent-color:#243782;flex:0 0 auto}
#stl-cc .cc-cat input:disabled{cursor:not-allowed}
#stl-cc .cc-cat .cc-more{margin-left:auto;font-size:13px;font-weight:400}
#stl-cc .cc-cat p{margin:6px 0 0 28px;font-size:13px}
#stl-cc .cc-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:18px}
#stl-cc .cc-foot .cc-pp{margin-right:auto;font-size:13px}
#stl-cc .cc-btn{min-height:44px;padding:0 18px;border-radius:10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;border:1px solid #243782;background:#243782;color:#fff}
#stl-cc .cc-btn:hover{background:#1a2862;border-color:#1a2862}
#stl-cc .cc-btn.ghost{background:#fff;color:#243782}
#stl-cc .cc-btn.ghost:hover{background:#eef0f8}
#stl-cc button:focus-visible,#stl-cc input:focus-visible,#stl-cc a:focus-visible{outline:2px solid #243782;outline-offset:2px}
@media (max-width:560px){#stl-cc{padding:8px;align-items:flex-end}#stl-cc .cc-box{padding:22px 18px 18px;max-height:calc(100vh - 16px)}#stl-cc h2{padding-right:0;margin-top:30px;font-size:18px}#stl-cc .cc-skip{top:12px;right:10px}#stl-cc .cc-foot .cc-pp{width:100%}#stl-cc .cc-btn{flex:1 1 100%}}
</style>
<script>
(function(){
  var NAME = "stl26_consent", VERSION = 2, DAYS = 182; // the choice expires after 6 months, then the banner asks again
  var PRIVACY = "/privacy-policy", POLICY = "/cookie-policy", LIST = "/cookie-policy#cookie-list";
  var CATS = [
    {id:"necessary", title:"Technically necessary", desc:"These Tools are essential for websites and their features to work properly. E.g.: authentication cookies.", locked:true},
    {id:"comfort", title:"Comfort", desc:"These Tools enable us to improve comfort and usability of websites and to provide various features. E.g.: comfort cookies can be used to store search results, language, character dimensions."},
    {id:"performance", title:"Performance", desc:"These Tools collect information about how you use websites. They help us, for example, to identify especially popular areas of our website. In this way, we can adapt the content of our websites more specifically to your needs and thereby improve what we offer you."},
    {id:"advertising", title:"Advertising", desc:"These Tools are used to send advertising and promotional information that is relevant to you, e.g. based on the web pages you visited."}
  ];
  var INTRO = '<p>We use cookies and/or other tracking tools (the “Tools”) to ensure that we give you the best experience on our website. They enable us to provide you core functionalities such as security, network management and accessibility.</p>'
    + '<p>The Tools improve usability and performance through various features such as language recognition, search results and thereby improve what we offer to you. Our website could use also third parties Tools to send advertising that is more relevant to you. Some Tools may be processed by third parties located in countries outside of the European Economic Area (EEA) who may not yet have an adequacy decision from the relevant European data protection authorities. In this case the transfer is based on your consent (Art. 49.1a GDPR).</p>';
  var MORE_BANNER = '<p>If you want to find out more about the Tools we use and how to manage them, and how your personal data are processed you can access to our <a href="' + POLICY + '">Cookie policy</a> or click on ‘Manage my settings’ button.</p>';
  var MORE_MANAGE = '<p>If you want to find out more about the Tools we use and how to manage them, you can access to our <a href="' + POLICY + '">Cookie policy</a> or click on ‘Save my settings’ button.</p>';
  function read(){
    var m = document.cookie.match(new RegExp("(?:^|; )" + NAME + "=([^;]*)"));
    if (!m) return null;
    try {
      var v = JSON.parse(decodeURIComponent(m[1]));
      if (!v || v.v !== VERSION) return null;
      if (v.ts && Date.now() - Date.parse(v.ts) > DAYS * 864e5) return null;
      return v;
    } catch(e){ return null; }
  }
  function write(c){
    var o = { v: VERSION, ts: new Date().toISOString() };
    CATS.forEach(function(k){ o[k.id] = k.locked ? true : !!c[k.id]; });
    var exp = new Date(Date.now() + DAYS*864e5).toUTCString();
    document.cookie = NAME + "=" + encodeURIComponent(JSON.stringify(o)) + "; expires=" + exp + "; path=/; SameSite=Lax" + (location.protocol === "https:" ? "; Secure" : "");
    return o;
  }
  // Scripts parked as <script type="text/plain" data-consent="comfort|performance|advertising"> run only after consent
  function activate(c){
    var list = document.querySelectorAll('script[type="text/plain"][data-consent]');
    for (var i=0;i<list.length;i++){
      var s = list[i], cat = s.getAttribute("data-consent");
      if (!c[cat] || s.getAttribute("data-activated")) continue;
      var n = document.createElement("script");
      for (var j=0;j<s.attributes.length;j++){ var a = s.attributes[j]; if (a.name !== "type" && a.name !== "data-consent") n.setAttribute(a.name, a.value); }
      if (!s.src) n.text = s.text;
      s.setAttribute("data-activated","1"); s.parentNode.insertBefore(n, s.nextSibling);
    }
  }
  function apply(c){
    api.state = c; activate(c);
    if (!c.comfort) { try { localStorage.removeItem("stl26_pp_lang"); } catch(e){} }
    try { document.dispatchEvent(new CustomEvent("stl:consent", {detail:c})); } catch(e){}
  }
  function all(v){ var c = {}; CATS.forEach(function(k){ c[k.id] = k.locked ? true : v; }); return c; }
  var box, lastFocus;
  function close(){ if (box){ box.parentNode.removeChild(box); box = null; if (lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch(e){} } }
  function save(c){ apply(write(c)); close(); }
  function render(manage){
    var cur = api.state || all(false);
    var html = '<div class="cc-box" role="dialog" aria-modal="false" aria-labelledby="stl-cc-t">'
      + '<button type="button" class="cc-skip" data-a="skip">Continue without accepting →</button>'
      + '<h2 id="stl-cc-t">Cookies and other tracking tools</h2>' + INTRO + (manage ? MORE_MANAGE : MORE_BANNER);
    if (manage) {
      html += '<div class="cc-cats">' + CATS.map(function(k){
        return '<div class="cc-cat"><label><input type="checkbox" data-cat="' + k.id + '"' + (k.locked || cur[k.id] ? ' checked' : '') + (k.locked ? ' disabled' : '') + '> ' + k.title
          + '<a class="cc-more" href="' + LIST + '">Find out more</a></label><p>' + k.desc + '</p></div>';
      }).join('') + '</div>';
    }
    html += '<div class="cc-foot"><a class="cc-pp" href="' + PRIVACY + '">Privacy Policy</a>'
      + (manage ? '<button type="button" class="cc-btn ghost" data-a="save">Save my settings</button>'
                : '<button type="button" class="cc-btn ghost" data-a="manage">Manage my settings</button>')
      + '<button type="button" class="cc-btn" data-a="accept">Accept all</button></div></div>';
    return html;
  }
  function show(manage){
    if (!box) {
      lastFocus = document.activeElement;
      box = document.createElement("div"); box.id = "stl-cc";
      box.addEventListener("click", function(e){
        var b = e.target.closest && e.target.closest("[data-a]"); if (!b) return;
        var a = b.getAttribute("data-a");
        if (a === "accept") save(all(true));
        else if (a === "skip") save(all(false));
        else if (a === "manage") { show(true); }
        else if (a === "save") { var c = {}; box.querySelectorAll("input[data-cat]").forEach(function(i){ c[i.getAttribute("data-cat")] = i.checked; }); save(c); }
      });
      box.addEventListener("keydown", function(e){ if (e.key === "Escape" && api.state) close(); });
      document.body.appendChild(box);
    }
    box.innerHTML = render(!!manage);
    var f = box.querySelector(manage ? "input:not([disabled])" : ".cc-btn"); if (f) try { f.focus({preventScroll:true}); } catch(e){}
  }
  var api = window.stlConsent = {
    state: null, cats: CATS,
    has: function(cat){ return !!(this.state && this.state[cat]); },
    open: function(){ show(true); },
    save: function(c){ save(c); }
  };
  function init(){
    // "Cookie Settings" link in the footer, next to the Cookie Policy link
    var pol = document.querySelectorAll('.footer a[href="/cookie-policy"]');
    for (var i=0;i<pol.length;i++){
      var l = pol[i].cloneNode(true); l.setAttribute("href","#cookie-settings"); l.classList.remove("w--current"); l.removeAttribute("aria-current");
      var t = l.querySelector("div") || l; t.textContent = "Cookie Settings";
      pol[i].parentNode.insertBefore(l, pol[i].nextSibling);
    }
    document.addEventListener("click", function(e){
      var a = e.target.closest && e.target.closest('a[href="#cookie-settings"],[data-cookie-settings]');
      if (a && !document.getElementById("cookie-settings")) { e.preventDefault(); show(true); }
    });
    var c = read();
    if (c) apply(c); else show(false);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();
</script>
