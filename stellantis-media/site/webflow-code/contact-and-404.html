<style>
/* Contact cards: phone under the name, hidden when the contact has no number */
.contact-block .div-block-2 a:empty{display:none}
.contact-block .div-block-2 a{display:block}
/* The corporate list and the extra brand lists (data-brand-tab) move into their own tabs */
.timeline-top .collection-list-wrapper-2,.timeline-top [data-brand-tab]{display:none}
</style>
<script>
// Contacts without a phone number: Webflow renders an empty tel: link, remove it
document.querySelectorAll('.contact-block .div-block-2 a[href^="tel:"]').forEach(function(a){ if (!a.textContent.trim()) a.parentNode.removeChild(a); });

// Extra tabs built from CMS lists placed at the top of the page:
// - "Stellantis Corporate" (first, open by default): list filtered on the "Stellantis Corporate" brand
// - every list with data-brand-tab="<Brand>" (e.g. Jeep): own tab, in alphabetical order among the brands
(function () {
  var tabs = document.querySelector('.timeline-tabs'), menu = tabs && tabs.querySelector('.w-tab-menu'), content = tabs && tabs.querySelector('.w-tab-content');
  if (!menu || !content) return;
  var first = menu.querySelector('.w-tab-link'); if (!first) return;
  function makeTab(name, id, list, emptyText, before) {
    var link = first.cloneNode(true);
    link.setAttribute('data-w-tab', id); link.removeAttribute('id'); link.removeAttribute('aria-controls');
    link.classList.remove('w--current');
    (link.querySelector('div') || link).textContent = name;
    var pane = document.createElement('div');
    pane.className = 'w-tab-pane'; pane.setAttribute('data-w-tab', id); pane.setAttribute('role', 'tabpanel');
    list.className = 'collectioncontact w-dyn-list'; list.style.display = '';
    var items = list.querySelector('.w-dyn-items'); if (items) items.classList.add('collectioncontact2');
    var empty = list.querySelector('.w-dyn-empty');
    if (empty) { empty.className = 'empty-state w-dyn-empty'; empty.innerHTML = '<div class="text-block-4">' + emptyText + '</div>'; }
    pane.appendChild(list);
    var beforePane = before && content.querySelector('.w-tab-pane[data-w-tab="' + before.getAttribute('data-w-tab') + '"]');
    menu.insertBefore(link, before || null);
    content.insertBefore(pane, beforePane || null);
    return link;
  }
  var later = 'Press contacts for this brand will be available soon. In the meantime, please contact the Stellantis press office.';
  document.querySelectorAll('.timeline-top [data-brand-tab]').forEach(function (list) {
    var name = list.getAttribute('data-brand-tab'), before = null;
    menu.querySelectorAll('.w-tab-link').forEach(function (l) { if (!before && l.textContent.trim().localeCompare(name, 'en', { sensitivity: 'base' }) > 0) before = l; });
    makeTab(name, 'Brand-' + name, list, later, before);
  });
  var corp = document.querySelector('.timeline-top .collection-list-wrapper-2');
  var start = corp ? makeTab('Stellantis Corporate', 'Corporate', corp, 'Stellantis Corporate press contacts will be available soon.', menu.querySelector('.w-tab-link')) : null;
  // The tabs are switched here (Webflow's own handler does not know the added tabs)
  function show(l) {
    var id = l.getAttribute('data-w-tab');
    menu.querySelectorAll('.w-tab-link').forEach(function (x) { var on = x === l; x.classList.toggle('w--current', on); x.setAttribute('aria-selected', on ? 'true' : 'false'); x.setAttribute('tabindex', on ? '0' : '-1'); });
    content.querySelectorAll('.w-tab-pane').forEach(function (p) { var on = p.getAttribute('data-w-tab') === id; p.classList.toggle('w--tab-active', on); p.style.opacity = ''; p.style.transition = ''; });
    tabs.setAttribute('data-current', id);
  }
  menu.addEventListener('click', function (e) {
    var l = e.target.closest('.w-tab-link'); if (!l) return;
    e.preventDefault(); e.stopPropagation(); show(l);
  }, true);
  show(start || menu.querySelector('.w-tab-link'));
})();
</script>
