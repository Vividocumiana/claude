<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>People I met · Samuele</title>
<meta name="theme-color" content="#F1F0EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Contacts">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/samuele.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F1F0EB; --ink: #141416; --ink-muted: #7A7976; --pill-line: #DCDAD3;
    --bezel: #121214; --panel: #1E1E21; --panel-line: #2D2D31; --on-panel: #F4F3EF; --on-panel-muted: #9A999E; --tile: #2A2A2E;
    --purple: #644BF6; --orange: #EC612A; --pink: #EF87E7; --green: #74DB8B;
    --sans: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono: 'Geist Mono', ui-monospace, 'SF Mono', monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0B0B0C; --ink: #F1F0EC; --ink-muted: #85848A; --pill-line: #26262A; --bezel: #19191C; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--bg); color: var(--ink); line-height: 1.45; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  button, input, textarea { font: inherit; color: inherit; }
  .hidden { display: none !important; }
  .wrap { max-width: 520px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
  .mono { font-family: var(--mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
  .card { background: var(--bezel); border-radius: 34px; padding: 7px; box-shadow: 0 30px 60px -24px rgba(20,20,22,.35), 0 12px 24px -14px rgba(20,20,22,.25); }
  .panel { background: var(--panel); border-radius: 27px; color: var(--on-panel); }

  /* Lock */
  .lock { min-height: calc(100vh - 60px); display: flex; flex-direction: column; justify-content: center; gap: 18px; }
  .lock .panel { padding: 28px 22px 24px; text-align: center; }
  .lock img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; }
  .lock h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.03em; margin-top: 14px; }
  .lock p { color: var(--on-panel-muted); font-size: 14px; margin-top: 4px; }
  .dots { display: flex; justify-content: center; gap: 12px; margin: 24px 0 6px; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--on-panel-muted); transition: background .15s, border-color .15s; }
  .dots i.on { background: var(--on-panel); border-color: var(--on-panel); }
  .dots.shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }
  .pin-input { position: absolute; opacity: 0; pointer-events: none; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
  .keypad button { height: 58px; border: 0; border-radius: 18px; background: var(--tile); color: var(--on-panel); font-size: 22px; font-weight: 500; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .keypad button:active { background: #36363b; }
  .keypad .ghost { background: none; font-size: 15px; color: var(--on-panel-muted); }
  .lock-err { color: #FF7A7A; font-size: 13px; min-height: 18px; margin-top: 8px; }

  /* Top */
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .me { display: flex; align-items: center; gap: 10px; }
  .me img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
  .me b { display: block; font-size: 15px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
  .me span { font-size: 12px; color: var(--ink-muted); }
  .icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--pill-line); background: none; cursor: pointer; display: grid; place-items: center; }
  .icon-btn svg { width: 17px; height: 17px; }

  /* Header panel */
  .head { padding: 20px 18px 16px; }
  .head h1 { font-size: 30px; font-weight: 600; letter-spacing: -0.04em; line-height: 1.05; }
  .head h1 span { color: var(--on-panel-muted); }
  .filters { display: flex; gap: 6px; margin-top: 14px; overflow-x: auto; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 9999px; padding: 8px 12px; background: var(--tile); color: var(--on-panel-muted); font-size: 13px; font-weight: 500; cursor: pointer; }
  .chip b { color: var(--on-panel); font-weight: 500; }
  .chip.on { background: var(--on-panel); color: #111; }
  .chip.on b { color: #111; }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .search { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 0 14px; border-radius: 14px; background: var(--tile); }
  .search svg { width: 16px; height: 16px; color: var(--on-panel-muted); flex-shrink: 0; }
  .search input { width: 100%; border: 0; background: none; outline: none; padding: 12px 0; font-size: 15px; color: var(--on-panel); }
  .search input::placeholder { color: var(--on-panel-muted); }

  /* Contacts */
  .list { padding: 4px 18px 10px; }
  .c { border-top: 1px solid var(--panel-line); }
  .c-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 0; border: 0; background: none; text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .av { width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; display: grid; place-items: center; font-weight: 600; font-size: 14px; color: #111; }
  .c-main { flex: 1; min-width: 0; }
  .c-name { font-size: 15px; font-weight: 500; color: var(--on-panel); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-sub { font-size: 13px; color: var(--on-panel-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-meta { text-align: right; flex-shrink: 0; }
  .c-time { font-size: 12px; color: var(--on-panel-muted); }
  .badge { display: inline-flex; align-items: center; gap: 5px; margin-top: 3px; font-size: 11px; color: var(--on-panel-muted); }
  .badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }

  .c-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .25s ease; }
  .c.open .c-body { grid-template-rows: 1fr; }
  .c-body > div { overflow: hidden; }
  .c-inner { padding: 0 0 16px 52px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .st { border: 0; border-radius: 9999px; padding: 7px 11px; font-size: 12px; font-weight: 500; background: var(--tile); color: var(--on-panel-muted); cursor: pointer; }
  .st.on { background: var(--c); color: #111; }
  .notes { width: 100%; margin-top: 10px; border: 1px solid var(--panel-line); background: var(--tile); border-radius: 14px; padding: 11px 12px; resize: vertical; min-height: 64px; font-size: 15px; color: var(--on-panel); outline: none; }
  .notes:focus { border-color: var(--on-panel-muted); }
  .saved { font-size: 12px; color: var(--on-panel-muted); min-height: 16px; margin-top: 4px; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .act { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 9999px; padding: 8px 12px; background: var(--tile); color: var(--on-panel); font-size: 13px; font-weight: 500; text-decoration: none; cursor: pointer; }
  .act.primary { background: var(--on-panel); color: #111; }
  .act[disabled] { opacity: .5; }
  .empty { padding: 34px 0 28px; text-align: center; color: var(--on-panel-muted); font-size: 14px; border-top: 1px solid var(--panel-line); }

  /* FAB + sheet */
  .fab { position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 5; display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 9999px; padding: 14px 20px; background: var(--ink); color: var(--bg); font-size: 15px; font-weight: 500; box-shadow: 0 12px 30px -10px rgba(0,0,0,.45); cursor: pointer; }
  .sheet-bg { position: fixed; inset: 0; z-index: 10; background: rgba(10,10,12,.35); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .25s ease; }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet { width: 100%; max-width: 520px; margin: 0 8px calc(8px + env(safe-area-inset-bottom)); border-radius: 30px; padding: 22px 20px 18px; color: var(--on-panel); background: rgba(30,30,33,.85); backdrop-filter: blur(28px) saturate(150%); -webkit-backdrop-filter: blur(28px) saturate(150%); border: 1px solid rgba(255,255,255,.08); transform: translateY(24px); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
  .sheet-bg.open .sheet { transform: none; }
  .sheet h2 { font-size: 21px; font-weight: 600; letter-spacing: -0.03em; }
  .field { display: block; border-bottom: 1px solid rgba(255,255,255,.12); }
  .field input, .field textarea { width: 100%; border: 0; background: none; outline: none; font-size: 16px; color: var(--on-panel); padding: 13px 0 9px; resize: none; }
  .field input::placeholder, .field textarea::placeholder { color: var(--on-panel-muted); }
  .check { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--on-panel-muted); margin-top: 14px; }
  .check input { width: 17px; height: 17px; accent-color: var(--purple); }
  .row-btns { display: flex; gap: 8px; margin-top: 18px; }
  .row-btns button { flex: 1; border: 0; border-radius: 9999px; padding: 14px; font-size: 15px; font-weight: 500; cursor: pointer; }
  .row-btns .cancel { background: rgba(255,255,255,.1); color: var(--on-panel); }
  .row-btns .save { background: #fff; color: #111; }
  .err { color: #FF7A7A; font-size: 13px; margin-top: 10px; }
  .err:empty { display: none; }
  @media (prefers-reduced-motion: no-preference) {
    .lock .card { animation: rise 1s cubic-bezier(.16,1,.3,1) backwards; }
    #app:not(.hidden) .top { animation: drop .7s cubic-bezier(.16,1,.3,1) backwards; }
    #app:not(.hidden) .card { animation: rise 1s cubic-bezier(.16,1,.3,1) .06s backwards; }
    #list.intro .c { animation: up .7s cubic-bezier(.16,1,.3,1) backwards; animation-delay: calc(.25s + var(--i, 0) * .04s); }
    .fab:not(.hidden) { animation: up .8s cubic-bezier(.16,1,.3,1) .4s backwards; }
    @keyframes drop { from { opacity: 0; transform: translateY(-10px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(40px) scale(.97); } }
    @keyframes up   { from { opacity: 0; transform: translateY(12px); } }
  }
  .toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 9999px; font-size: 14px; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Lock -->
  <section class="lock" id="lock">
    <div class="card"><div class="panel">
      <img src="/samuele.jpg" alt="">
      <h1>People I met</h1>
      <p>Enter your PIN</p>
      <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
      <div class="lock-err" id="lockErr"></div>
      <input class="pin-input" id="pin" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="4" aria-label="PIN">
      <div class="keypad" id="keypad">
        <button>1</button><button>2</button><button>3</button>
        <button>4</button><button>5</button><button>6</button>
        <button>7</button><button>8</button><button>9</button>
        <span></span><button>0</button><button class="ghost" data-k="del" aria-label="Delete">⌫</button>
      </div>
    </div></div>
  </section>

  <!-- App -->
  <section id="app" class="hidden">
    <div class="top">
      <div class="me"><img src="/samuele.jpg" alt=""><div><b>Samuele Poggio</b><span>Tech Week contacts</span></div></div>
      <button class="icon-btn" id="refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg></button>
    </div>

    <div class="card"><div class="panel">
      <div class="head">
        <h1>People I met <span id="count">0</span></h1>
        <div class="filters" id="filters"></div>
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Search name, company, notes">
        </label>
      </div>
      <div class="list" id="list"></div>
    </div></div>
  </section>
</div>

<button class="fab hidden" id="add"><span aria-hidden="true">+</span> Add someone</button>

<div class="sheet-bg" id="sheetBg" aria-hidden="true">
  <form class="sheet" id="addForm" role="dialog" aria-modal="true" aria-labelledby="addTitle">
    <h2 id="addTitle">Add someone I met</h2>
    <label class="field"><input name="name" placeholder="Name" autocomplete="off"></label>
    <label class="field"><input name="email" type="email" placeholder="Email (optional)" inputmode="email" autocomplete="off"></label>
    <label class="field"><input name="company" placeholder="Company / role" autocomplete="off"></label>
    <label class="field"><textarea name="notes" rows="2" placeholder="What did we talk about?"></textarea></label>
    <label class="check"><input type="checkbox" name="sendEmail" checked> Send them the "Nice to meet you" email</label>
    <div class="err" id="addErr"></div>
    <div class="row-btns"><button type="button" class="cancel" id="cancel">Cancel</button><button type="submit" class="save">Save</button></div>
  </form>
</div>

<script>
const STATUSES = [
  { name: 'New', c: '#644BF6' },
  { name: 'Follow-up', c: '#EC612A' },
  { name: 'Call booked', c: '#74DB8B' },
  { name: 'Done', c: '#9A999E' },
];
const color = (s) => (STATUSES.find((x) => x.name === s) || STATUSES[0]).c;
const AV = ['#EF87E7', '#EC612A', '#A99BFF', '#74DB8B', '#FFD300'];
const $ = (id) => document.getElementById(id);
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: (k) => { try { localStorage.removeItem(k); } catch {} },
};
let pin = store.get('tw-pin') || '';
let contacts = [];
let filter = 'All';
let openId = null;

const esc = (s) => String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const initials = (n) => (n || '?').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
const avColor = (s) => AV[[...(s || '')].reduce((a, c) => a + c.charCodeAt(0), 0) % AV.length];
function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'now'; if (m < 60) return m + 'm';
  const h = Math.round(m / 60); if (h < 24) return h + 'h';
  return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

async function api(method, body) {
  const res = await fetch('/api/contacts', {
    method, headers: { 'Content-Type': 'application/json', 'x-pin': pin },
    body: body ? JSON.stringify(body) : undefined,
  });
  const out = await res.json().catch(() => ({}));
  if (res.status === 401) { store.del('tw-pin'); throw Object.assign(new Error('Wrong PIN'), { auth: true }); }
  if (!res.ok) throw new Error(out.error || 'Error');
  return out;
}

/* ── Lock ───────────────────────────────────────── */
const dots = [...$('dots').children];
function paintDots() { dots.forEach((d, i) => d.classList.toggle('on', i < $('pin').value.length)); }
function typeKey(k) {
  const input = $('pin');
  if (k === 'del') input.value = input.value.slice(0, -1);
  else if (input.value.length < 4) input.value += k;
  $('lockErr').textContent = '';
  paintDots();
  if (input.value.length === 4) unlock(input.value);
}
$('keypad').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  typeKey(b.dataset.k || b.textContent);
});
document.addEventListener('keydown', (e) => {
  if ($('lock').classList.contains('hidden')) return;
  if (/^\d$/.test(e.key)) typeKey(e.key);
  if (e.key === 'Backspace') typeKey('del');
});
function unlock(value) {
  pin = value; store.set('tw-pin', pin);
  load();
}
function showLock(msg) {
  $('app').classList.add('hidden'); $('add').classList.add('hidden'); $('lock').classList.remove('hidden');
  $('pin').value = ''; paintDots();
  $('lockErr').textContent = msg || '';
  if (msg) { $('dots').classList.remove('shake'); void $('dots').offsetWidth; $('dots').classList.add('shake'); }
}

async function load() {
  try {
    const { contacts: list } = await api('GET');
    contacts = list;
    const first = $('app').classList.contains('hidden');
    $('lock').classList.add('hidden'); $('app').classList.remove('hidden'); $('add').classList.remove('hidden');
    // Stagger the rows only when the list first appears, not on every re-render.
    if (first) { $('list').classList.add('intro'); setTimeout(() => $('list').classList.remove('intro'), 1400); }
    render();
  } catch (err) {
    showLock(err.auth ? 'Wrong PIN' : 'PIN ok, but the server failed: ' + err.message);
  }
}

/* ── List ───────────────────────────────────────── */
function render() {
  $('count').textContent = contacts.length;
  const counts = Object.fromEntries(STATUSES.map((s) => [s.name, contacts.filter((c) => c.status === s.name).length]));
  $('filters').innerHTML =
    `<button class="chip ${filter === 'All' ? 'on' : ''}" data-f="All">All <b>${contacts.length}</b></button>` +
    STATUSES.map((s) => `<button class="chip ${filter === s.name ? 'on' : ''}" data-f="${s.name}" style="--c:${s.c}"><i></i>${s.name} <b>${counts[s.name]}</b></button>`).join('');

  const q = $('search').value.trim().toLowerCase();
  const shown = contacts.filter((c) =>
    (filter === 'All' || c.status === filter) &&
    (!q || [c.name, c.email, c.company, c.notes].join(' ').toLowerCase().includes(q)));

  $('list').innerHTML = shown.length ? shown.map((c, i) => `
    <div class="c ${openId === c.id ? 'open' : ''}" data-id="${c.id}" style="--i:${Math.min(i, 12)}">
      <button class="c-row">
        <span class="av" style="background:${avColor(c.name || c.email)}">${esc(initials(c.name || c.email))}</span>
        <span class="c-main">
          <span class="c-name" style="display:block">${esc(c.name || c.email || 'No name')}</span>
          <span class="c-sub" style="display:block">${esc(c.company || c.email || (c.source === 'Manual' ? 'Added manually' : ''))}</span>
        </span>
        <span class="c-meta">
          <span class="c-time" style="display:block">${ago(c.created)}</span>
          <span class="badge" style="--c:${color(c.status)}"><i></i>${esc(c.status)}</span>
        </span>
      </button>
      <div class="c-body"><div><div class="c-inner">
        <div class="seg">${STATUSES.map((s) => `<button class="st ${c.status === s.name ? 'on' : ''}" data-s="${s.name}" style="--c:${s.c}">${s.name}</button>`).join('')}</div>
        <textarea class="notes" rows="2" placeholder="Quick note…">${esc(c.notes)}</textarea>
        <div class="saved"></div>
        <div class="actions">
          ${c.email && !c.emailSent ? '<button class="act primary send">Send email</button>' : ''}
          ${c.email ? `<a class="act" href="mailto:${esc(c.email)}">Email${c.emailSent ? ' · card sent ✓' : ''}</a>` : ''}
          <a class="act" href="${esc(c.url)}" target="_blank" rel="noopener">Notion ↗</a>
        </div>
      </div></div></div>
    </div>`).join('')
    : `<div class="empty">${contacts.length ? 'No matches.' : 'No contacts yet. Go say hi 👋'}</div>`;
}

$('refresh').onclick = () => load().then(() => toast('Updated'));
$('search').oninput = render;
$('filters').onclick = (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  filter = b.dataset.f; render();
};

$('list').addEventListener('click', async (e) => {
  const card = e.target.closest('.c'); if (!card) return;
  const c = contacts.find((x) => x.id === card.dataset.id);

  if (e.target.closest('.c-row')) {
    openId = openId === c.id ? null : c.id;
    document.querySelectorAll('.c').forEach((el) => el.classList.toggle('open', el.dataset.id === openId));
    return;
  }
  const st = e.target.closest('.st');
  if (st) {
    const prev = c.status; c.status = st.dataset.s; render();
    try { await api('PATCH', { id: c.id, status: c.status }); }
    catch (err) { c.status = prev; render(); toast(err.message); }
    return;
  }
  const send = e.target.closest('.send');
  if (send) {
    send.disabled = true; send.textContent = 'Sending…';
    try { Object.assign(c, (await api('PATCH', { id: c.id, sendEmail: true })).contact); render(); toast('Email sent'); }
    catch (err) { send.disabled = false; send.textContent = 'Send email'; toast(err.message); }
  }
});

const timers = {};
$('list').addEventListener('input', (e) => {
  if (!e.target.classList.contains('notes')) return;
  const card = e.target.closest('.c'); const id = card.dataset.id; const savedEl = card.querySelector('.saved');
  const c = contacts.find((x) => x.id === id); c.notes = e.target.value;
  savedEl.textContent = 'Saving…';
  clearTimeout(timers[id]);
  timers[id] = setTimeout(async () => {
    try { await api('PATCH', { id, notes: c.notes }); savedEl.textContent = 'Saved to Notion ✓'; }
    catch (err) { savedEl.textContent = '⚠ ' + err.message; }
  }, 800);
});

/* ── Add sheet ──────────────────────────────────── */
function setSheet(open) {
  $('sheetBg').classList.toggle('open', open);
  $('sheetBg').setAttribute('aria-hidden', !open);
  if (open) setTimeout(() => $('addForm').name.focus(), 250);
  else { $('addForm').reset(); $('addErr').textContent = ''; }
}
$('add').onclick = () => setSheet(true);
$('cancel').onclick = () => setSheet(false);
$('sheetBg').onclick = (e) => { if (e.target === $('sheetBg')) setSheet(false); };
$('addForm').onsubmit = async (e) => {
  e.preventDefault();
  const f = e.target; const btn = f.querySelector('.save');
  const body = Object.fromEntries(new FormData(f)); body.sendEmail = f.sendEmail.checked;
  btn.disabled = true; btn.textContent = 'Saving…'; $('addErr').textContent = '';
  try {
    const { contact } = await api('POST', body);
    contacts.unshift(contact); render(); setSheet(false);
    toast(contact.emailSent ? 'Saved & email sent' : body.sendEmail && body.email ? 'Saved — email failed, retry from the contact' : 'Saved');
  } catch (err) { $('addErr').textContent = err.message; }
  finally { btn.disabled = false; btn.textContent = 'Save'; }
};

if (pin) load(); else showLock();
</script>
</body>
</html>
