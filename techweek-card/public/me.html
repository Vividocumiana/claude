<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>My contacts · Tech Week</title>
<meta name="theme-color" content="#1D1D1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Contacts">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --purple:#644BF6; --orange:#EC612A; --pink:#EF87E7; --green:#74DB8B; --yellow:#FFD300; --black:#1D1D1F; --gray:#F2F2F0; --bg:#F5F5F0; --muted:#6B6B70; --font:'Poppins',system-ui,-apple-system,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font); background:var(--bg); color:var(--black); line-height:1.45; min-height:100vh; }
  .wrap { max-width:560px; margin:0 auto; padding:16px 16px calc(40px + env(safe-area-inset-bottom)); }
  button, input, textarea, select { font:inherit; color:inherit; }
  .hidden { display:none !important; }

  /* Lock */
  .lock { min-height:80vh; display:flex; flex-direction:column; justify-content:center; text-align:center; gap:14px; }
  .lock h1 { font-size:28px; font-weight:800; letter-spacing:-.02em; }
  .lock input { text-align:center; font-size:28px; letter-spacing:.4em; padding:14px; border-radius:18px; border:2px solid var(--gray); background:#fff; outline:none; }
  .lock input:focus { border-color:var(--purple); }

  /* Top */
  .top { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:4px 0 14px; position:sticky; top:0; background:var(--bg); z-index:2; }
  .top h1 { font-size:24px; font-weight:800; letter-spacing:-.02em; }
  .top h1 span { color:var(--purple); }
  .pill { border:0; border-radius:9999px; padding:10px 16px; font-weight:600; font-size:14px; cursor:pointer; }
  .pill.dark { background:var(--black); color:#fff; } .pill.light { background:#fff; }
  .pill.orange { background:var(--orange); color:#fff; } .pill.purple { background:var(--purple); color:#fff; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
  .stat { background:#fff; border-radius:16px; padding:10px 8px; text-align:center; cursor:pointer; border:2px solid transparent; }
  .stat.on { border-color:var(--purple); }
  .stat b { display:block; font-size:22px; font-weight:800; }
  .stat small { font-size:11px; color:var(--muted); font-weight:500; }
  .search { width:100%; padding:12px 16px; border-radius:16px; border:2px solid var(--gray); background:#fff; outline:none; margin-bottom:12px; }
  .search:focus { border-color:var(--purple); }

  /* Contact cards */
  .c { background:#fff; border-radius:20px; padding:16px; margin-bottom:10px; }
  .c-head { display:flex; gap:12px; align-items:center; }
  .c-av { width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; flex-shrink:0; }
  .c-main { flex:1; min-width:0; }
  .c-name { font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .c-sub { font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .c-sub a { color:var(--purple); text-decoration:none; }
  .c-time { font-size:12px; color:var(--muted); text-align:right; flex-shrink:0; }
  .c-time .mail { display:block; margin-top:2px; }
  .statuses { display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
  .st { border:0; border-radius:9999px; padding:6px 12px; font-size:12px; font-weight:600; background:var(--gray); cursor:pointer; }
  .st.on[data-s="New"] { background:var(--purple); color:#fff; }
  .st.on[data-s="Follow-up"] { background:var(--orange); color:#fff; }
  .st.on[data-s="Call booked"] { background:var(--green); color:var(--black); }
  .st.on[data-s="Done"] { background:var(--black); color:#fff; }
  .notes { width:100%; margin-top:10px; border:2px solid var(--gray); background:var(--gray); border-radius:14px; padding:10px 12px; resize:vertical; min-height:44px; font-size:15px; outline:none; }
  .notes:focus { border-color:var(--purple); background:#fff; }
  .saved { font-size:12px; color:var(--muted); height:16px; margin-top:4px; }
  .c-links { display:flex; gap:12px; margin-top:6px; font-size:13px; }
  .c-links a { color:var(--muted); }
  .send { border:0; background:var(--orange); color:#fff; border-radius:9999px; padding:4px 12px; font-size:12px; font-weight:600; cursor:pointer; margin-left:auto; }
  .send[disabled] { opacity:.6; }

  .empty { text-align:center; color:var(--muted); padding:40px 0; }

  /* Sheet */
  .sheet-bg { position:fixed; inset:0; background:rgba(29,29,31,.45); z-index:10; display:flex; align-items:flex-end; justify-content:center; }
  .sheet { background:#fff; width:100%; max-width:560px; border-radius:28px 28px 0 0; padding:22px 16px calc(22px + env(safe-area-inset-bottom)); }
  .sheet h2 { font-size:20px; font-weight:800; margin-bottom:10px; }
  .sheet input, .sheet textarea { width:100%; padding:12px 14px; border-radius:14px; border:2px solid var(--gray); background:var(--gray); margin-top:8px; outline:none; font-size:16px; }
  .sheet input:focus, .sheet textarea:focus { border-color:var(--purple); background:#fff; }
  .sheet label { display:flex; gap:8px; align-items:center; margin-top:12px; font-size:14px; }
  .sheet .row { display:flex; gap:8px; margin-top:16px; } .sheet .row .pill { flex:1; padding:14px; }
  .err { color:#E64949; font-size:14px; margin-top:8px; }
  .toast { position:fixed; bottom:calc(20px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:var(--black); color:#fff; padding:10px 18px; border-radius:9999px; font-size:14px; z-index:20; }
</style>
</head>
<body>
<div class="wrap">

  <div class="lock" id="lock">
    <div style="font-size:40px">✦</div>
    <h1>My Tech Week contacts</h1>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" maxlength="12">
    <button class="pill purple" id="unlock" style="padding:14px">Open</button>
    <div class="err" id="lockErr"></div>
  </div>

  <div id="app" class="hidden">
    <div class="top">
      <h1>People I met <span id="count"></span></h1>
      <div style="display:flex;gap:6px">
        <button class="pill light" id="refresh" aria-label="Refresh">↻</button>
        <button class="pill orange" id="add">+ Add</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <input class="search" id="search" type="search" placeholder="Search name, company, notes…">
    <div id="list"></div>
  </div>
</div>

<div class="sheet-bg hidden" id="sheetBg">
  <form class="sheet" id="addForm">
    <h2>Add someone I met</h2>
    <input name="name" placeholder="Name" autocomplete="off">
    <input name="email" type="email" placeholder="Email (optional)" inputmode="email" autocomplete="off">
    <input name="company" placeholder="Company / role" autocomplete="off">
    <textarea name="notes" rows="3" placeholder="What did we talk about?"></textarea>
    <label><input type="checkbox" name="sendEmail" checked> Send them the "Nice to meet you" email</label>
    <div class="err" id="addErr"></div>
    <div class="row">
      <button type="button" class="pill light" id="cancel">Cancel</button>
      <button type="submit" class="pill purple">Save</button>
    </div>
  </form>
</div>

<script>
const STATUSES = ['New', 'Follow-up', 'Call booked', 'Done'];
const COLORS = ['#644BF6', '#EC612A', '#EF87E7', '#74DB8B', '#3478F6'];
const $ = (id) => document.getElementById(id);
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: (k) => { try { localStorage.removeItem(k); } catch {} },
};
let pin = store.get('tw-pin') || '';
let contacts = [];
let filter = 'All';

const esc = (s) => String(s || '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
const initials = (n) => (n || '?').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
const color = (s) => COLORS[[...(s || '')].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'now'; if (m < 60) return m + 'm ago';
  const h = Math.round(m / 60); if (h < 24) return h + 'h ago';
  return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

async function api(method, body) {
  const res = await fetch('/api/contacts', {
    method, headers: { 'Content-Type': 'application/json', 'x-pin': pin },
    body: body ? JSON.stringify(body) : undefined,
  });
  const out = await res.json().catch(() => ({}));
  if (res.status === 401) { store.del('tw-pin'); throw Object.assign(new Error('Wrong PIN'), { auth: true }); }
  if (!res.ok) throw new Error(out.error || 'Error');
  return out;
}

async function load() {
  try {
    const { contacts: list } = await api('GET');
    contacts = list;
    $('lock').classList.add('hidden'); $('app').classList.remove('hidden');
    render();
  } catch (err) {
    $('app').classList.add('hidden'); $('lock').classList.remove('hidden');
    $('lockErr').textContent = !pin ? '' : err.auth ? 'Wrong PIN' : 'PIN ok, but the server failed: ' + err.message;
  }
}

function render() {
  $('count').textContent = contacts.length;
  const counts = Object.fromEntries(STATUSES.map((s) => [s, contacts.filter((c) => c.status === s).length]));
  $('stats').innerHTML = STATUSES.map((s) =>
    `<div class="stat ${filter === s ? 'on' : ''}" data-f="${s}"><b>${counts[s]}</b><small>${s}</small></div>`).join('');

  const q = $('search').value.trim().toLowerCase();
  const shown = contacts.filter((c) =>
    (filter === 'All' || c.status === filter) &&
    (!q || [c.name, c.email, c.company, c.notes].join(' ').toLowerCase().includes(q)));

  $('list').innerHTML = shown.length ? shown.map((c) => `
    <div class="c" data-id="${c.id}">
      <div class="c-head">
        <div class="c-av" style="background:${color(c.name || c.email)}">${esc(initials(c.name || c.email))}</div>
        <div class="c-main">
          <div class="c-name">${esc(c.name || c.email || 'No name')}</div>
          <div class="c-sub">${c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : ''}${c.email && c.company ? ' · ' : ''}${esc(c.company)}</div>
        </div>
        <div class="c-time">${ago(c.created)}<span class="mail">${c.emailSent ? '✉️ sent' : c.source === 'Manual' ? '✍️ manual' : ''}</span></div>
      </div>
      <div class="statuses">${STATUSES.map((s) => `<button class="st ${c.status === s ? 'on' : ''}" data-s="${s}">${s}</button>`).join('')}</div>
      <textarea class="notes" rows="2" placeholder="Quick note…">${esc(c.notes)}</textarea>
      <div class="saved"></div>
      <div class="c-links"><a href="${esc(c.url)}" target="_blank" rel="noopener">Open in Notion ↗</a>${c.email && !c.emailSent ? '<button class="send">Send email ✉️</button>' : ''}</div>
    </div>`).join('')
    : `<div class="empty">${contacts.length ? 'No matches.' : 'No contacts yet. Go say hi 👋'}</div>`;
}

// Events
$('unlock').onclick = () => { pin = $('pin').value.trim(); store.set('tw-pin', pin); load(); };
$('pin').onkeydown = (e) => { if (e.key === 'Enter') $('unlock').click(); };
$('refresh').onclick = () => load().then(() => toast('Updated'));
$('search').oninput = render;
$('stats').onclick = (e) => {
  const s = e.target.closest('.stat'); if (!s) return;
  filter = filter === s.dataset.f ? 'All' : s.dataset.f; render();
};

$('list').addEventListener('click', async (e) => {
  const send = e.target.closest('.send'); if (!send) return;
  const c = contacts.find((x) => x.id === send.closest('.c').dataset.id);
  send.disabled = true; send.textContent = 'Sending…';
  try {
    const { contact } = await api('PATCH', { id: c.id, sendEmail: true });
    Object.assign(c, contact); render(); toast('Email sent ✉️');
  } catch (err) { send.disabled = false; send.textContent = 'Send email ✉️'; toast(err.message); }
});

$('list').addEventListener('click', async (e) => {
  const b = e.target.closest('.st'); if (!b) return;
  const card = b.closest('.c'); const c = contacts.find((x) => x.id === card.dataset.id);
  const prev = c.status; c.status = b.dataset.s; render();
  try { await api('PATCH', { id: c.id, status: c.status }); }
  catch (err) { c.status = prev; render(); toast(err.message); }
});

const timers = {};
$('list').addEventListener('input', (e) => {
  if (!e.target.classList.contains('notes')) return;
  const card = e.target.closest('.c'); const id = card.dataset.id; const savedEl = card.querySelector('.saved');
  const c = contacts.find((x) => x.id === id); c.notes = e.target.value;
  savedEl.textContent = 'Saving…';
  clearTimeout(timers[id]);
  timers[id] = setTimeout(async () => {
    try { await api('PATCH', { id, notes: c.notes }); savedEl.textContent = 'Saved to Notion ✓'; }
    catch (err) { savedEl.textContent = '⚠ ' + err.message; }
  }, 800);
});

$('add').onclick = () => { $('sheetBg').classList.remove('hidden'); $('addForm').name.focus(); };
$('cancel').onclick = () => { $('sheetBg').classList.add('hidden'); $('addForm').reset(); $('addErr').textContent = ''; };
$('sheetBg').onclick = (e) => { if (e.target === $('sheetBg')) $('cancel').click(); };
$('addForm').onsubmit = async (e) => {
  e.preventDefault();
  const f = e.target; const btn = f.querySelector('[type=submit]');
  const body = Object.fromEntries(new FormData(f)); body.sendEmail = f.sendEmail.checked;
  btn.disabled = true; btn.textContent = 'Saving…'; $('addErr').textContent = '';
  try {
    const { contact } = await api('POST', body);
    contacts.unshift(contact); render(); $('cancel').click();
    toast(contact.emailSent ? 'Saved & email sent ✉️' : body.sendEmail && body.email ? 'Saved — email failed, retry from the card' : 'Saved');
  } catch (err) { $('addErr').textContent = err.message; }
  finally { btn.disabled = false; btn.textContent = 'Save'; }
};

if (pin) load();
</script>
</body>
</html>
