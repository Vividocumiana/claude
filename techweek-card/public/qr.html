<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Scan me · Samuele</title>
<meta name="theme-color" content="#F1F0EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My QR">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/samuele.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/vendor/qrcode.js"></script>
<style>
  :root {
    --bg: #F1F0EB; --ink: #141416; --ink-muted: #7A7976; --pill-line: #DCDAD3;
    --bezel: #121214; --on-panel: #F4F3EF; --on-panel-muted: #9A999E;
    --sans: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0B0B0C; --ink: #F1F0EC; --ink-muted: #85848A; --pill-line: #26262A; --bezel: #19191C; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--sans); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden;
         display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
         padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); }

  .switch { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--pill-line); border-radius: 9999px; }
  .switch button { border: 0; background: none; color: var(--ink-muted); font: 500 14px var(--sans); padding: 9px 16px; border-radius: 9999px; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background .2s, color .2s; }
  .switch button.on { background: var(--ink); color: var(--bg); }

  .card { width: min(100%, 360px); background: var(--bezel); border-radius: 38px; padding: 7px; box-shadow: 0 30px 60px -20px rgba(20,20,22,.35), 0 12px 24px -12px rgba(20,20,22,.25); }
  .qr { position: relative; background: #fff; border-radius: 31px; padding: 22px; aspect-ratio: 1; }
  .qr #code, .qr #code svg { width: 100%; height: 100%; display: block; }
  .qr .mark { position: absolute; left: 50%; top: 50%; width: 19%; height: 19%; transform: translate(-50%, -50%); background: #fff; border-radius: 14px; padding: 7px; display: grid; place-items: center; }
  .qr .mark img { width: 100%; height: 100%; }
  .qr.contact .mark { display: none; }

  .who { display: flex; align-items: center; gap: 12px; padding: 16px 14px 12px; color: var(--on-panel); }
  .who img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
  .who b { display: block; font-weight: 600; font-size: 17px; letter-spacing: -0.02em; line-height: 1.2; }
  .who span { font-size: 14px; color: var(--on-panel-muted); }

  .hint { font-size: 14px; color: var(--ink-muted); text-align: center; min-height: 20px; }
</style>
</head>
<body>
  <div class="switch" role="tablist">
    <button data-mode="card" role="tab">My card</button>
    <button data-mode="contact" role="tab">Save contact</button>
  </div>

  <div class="card">
    <div class="qr">
      <div id="code"></div>
      <span class="mark"><img src="/favicon.svg" alt=""></span>
    </div>
    <div class="who">
      <img src="/samuele.jpg" alt="">
      <div><b>Samuele Poggio</b><span>Founder · Vivido, Nest, Nitido</span></div>
    </div>
  </div>

  <p class="hint" id="hint"></p>

<script>
  // Two modes:
  //  card    → QR opens the card page (form, Book a call, links)
  //  contact → QR holds the vCard itself: the phone camera offers "Add contact" natively
  const VCARD = [
    'BEGIN:VCARD', 'VERSION:3.0', 'N:Poggio;Samuele;;;', 'FN:Samuele Poggio',
    'ORG:Vivido', 'TITLE:Co-founder', 'TEL;TYPE=CELL:+393335839398',
    'EMAIL:samuele@vivido.world', 'URL:' + location.origin, 'END:VCARD',
  ].join('\n');
  const MODES = {
    card: { data: location.origin + '/?src=qr', ec: 'H', hint: 'Scan to open my card' },
    contact: { data: VCARD, ec: 'M', hint: 'Scan with your camera to add me to contacts' },
  };
  const store = {
    get: () => { try { return localStorage.getItem('qr-mode'); } catch { return null; } },
    set: (v) => { try { localStorage.setItem('qr-mode', v); } catch {} },
  };

  function render(mode) {
    const m = MODES[mode];
    const qr = qrcode(0, m.ec); // H leaves room for the center logo; the vCard is denser, so M and no logo
    qr.addData(m.data, 'Byte'); qr.make();
    const box = document.getElementById('code');
    box.innerHTML = qr.createSvgTag({ scalable: true, margin: 0 });
    box.querySelectorAll('path').forEach((p) => p.setAttribute('fill', '#141416'));
    document.querySelector('.qr').classList.toggle('contact', mode === 'contact');
    document.getElementById('hint').textContent = m.hint;
    document.querySelectorAll('.switch button').forEach((b) => {
      b.classList.toggle('on', b.dataset.mode === mode);
      b.setAttribute('aria-selected', b.dataset.mode === mode);
    });
    store.set(mode);
  }
  document.querySelector('.switch').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (b) render(b.dataset.mode);
  });
  render(MODES[store.get()] ? store.get() : 'card');

  // Keep the screen awake while showing the QR, where supported.
  if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(() => {});
</script>
</body>
</html>
