<title>Rookiess Clay Test</title>
<style>
  :root { color-scheme:dark; --top:#0f1c93; --mid:#192ac1; --bot:#2135e7; --ink:#fff; --chip:rgba(255,255,255,.14); --chip-on:#fff; --chip-on-ink:#1530d8; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { background:linear-gradient(180deg, var(--top), var(--mid) 50%, var(--bot)); color:var(--ink);
         font:500 13px/1.3 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif; overflow:hidden; }
  .stage { position:fixed; inset:0; display:grid; place-items:center; padding:64px 16px 16px; }
  .frame { position:relative; width:min(100%, calc((100vh - 80px) * 1280 / 832)); aspect-ratio:1280 / 832; max-width:100%; }
  .frame canvas, .frame img { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .frame img { pointer-events:none; opacity:0; }
  canvas { touch-action:pan-y; cursor:pointer; }
  body[data-mode="studio"] .frame img { display:none; }
  header { position:fixed; top:calc(12px + env(safe-area-inset-top, 0px)); left:16px; right:16px; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; z-index:2; }
  h1 { font-size:14px; font-weight:600; margin-right:auto; }
  h1 small { display:block; font-weight:400; opacity:.7; font-size:11px; margin-top:2px; }
  .grp { display:flex; gap:4px; flex-wrap:wrap; align-items:center; }
  .grp span { opacity:.6; margin-right:4px; }
  button { font:inherit; color:inherit; background:var(--chip); border:0; border-radius:999px; padding:6px 11px; cursor:pointer; }
  button[aria-pressed="true"] { background:var(--chip-on); color:var(--chip-on-ink); }
  button:focus-visible, input:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  input[type=range] { width:110px; accent-color:#fff; }
  #stats { position:fixed; left:16px; bottom:calc(10px + env(safe-area-inset-bottom, 0px)); font:11px/1.4 ui-monospace, Menlo, monospace; opacity:.75; font-variant-numeric:tabular-nums; }
</style>
<header>
  <h1>Rookiess · personaggio SDF<small>Clic su un personaggio per colpirlo</small></h1>
  <div class="grp" id="modes"><span>Vista</span><button data-mode="hero" aria-pressed="true">Hero</button><button data-mode="studio" aria-pressed="false">Studio</button></div>
  <div class="grp" id="debug"><span>Debug</span><button data-debug="final" aria-pressed="true">Finale</button><button data-debug="bake">Luce</button><button data-debug="normals">Normali</button><button data-debug="parts">Parti</button><button data-debug="wire">Wireframe</button></div>
  <label class="grp" id="ovl"><span>Figma</span><input id="ovr" type="range" min="0" max="100" value="0" aria-label="Opacità del design Figma sovrapposto"></label>
</header>
<div class="stage"><div class="frame">
  <canvas id="c" aria-label="Tavolo del gioco con i personaggi"></canvas>
  <img id="ref" alt="" src="data:image/png;base64,__HERO__">
</div></div>
<div id="stats">Preparo i personaggi…</div>
<script>/*__BUNDLE__*/</script>
