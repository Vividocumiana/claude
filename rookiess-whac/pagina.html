<title>Rookiess Clay Test</title>
<style>/*__CURSOR_CSS__*/</style>
<style>
  :root { color-scheme:dark; --top:#0f1c93; --mid:#192ac1; --bot:#2135e7; --ink:#fff; --chip:rgba(255,255,255,.14); --chip-on:#fff; --chip-on-ink:#1530d8; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { background:linear-gradient(180deg, var(--top), var(--mid) 50%, var(--bot)); color:var(--ink);
         font:500 13px/1.3 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif; overflow:hidden; }
  .stage { position:fixed; inset:0; display:grid; place-items:center; padding:64px 16px 16px; }
  .frame { position:relative; width:min(100%, calc((100vh - 80px) * 1280 / 832)); aspect-ratio:1280 / 832; max-width:100%; }
  .frame canvas, .frame img { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .frame img { pointer-events:none; opacity:0; }
  canvas { touch-action:pan-y; }
  body[data-mode="studio"] .frame img, body[data-mode="studio"] .score { display:none; }
  header { position:fixed; top:calc(12px + env(safe-area-inset-top, 0px)); left:16px; right:16px; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; z-index:2; }
  h1 { font-size:14px; font-weight:600; margin-right:auto; }
  h1 small { display:block; font-weight:400; opacity:.7; font-size:11px; margin-top:2px; }
  .grp { display:flex; gap:4px; flex-wrap:wrap; align-items:center; }
  .grp span { opacity:.6; margin-right:4px; }
  button { font:inherit; color:inherit; background:var(--chip); border:0; border-radius:999px; padding:6px 11px; cursor:pointer; }
  button[aria-pressed="true"] { background:var(--chip-on); color:var(--chip-on-ink); }
  button:focus-visible, input:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  input[type=range] { width:110px; accent-color:#fff; }
  .labels { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .pop-label { position:absolute; transform:translate(-50%, -100%); font:800 clamp(16px, 2.2vw, 26px)/1 ui-sans-serif, system-ui, sans-serif;
               color:#fff; text-shadow:0 2px 0 #0b1680; animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes rise { from { opacity:0; transform:translate(-50%, -60%) scale(.6); } 20% { opacity:1; transform:translate(-50%, -110%) scale(1.15); } to { opacity:0; transform:translate(-50%, -260%) scale(1); } }
  @media (prefers-reduced-motion: reduce) { .pop-label { animation-duration:.01s; animation-fill-mode:none; opacity:1; } }
  .score { position:absolute; left:74%; top:63%; display:grid; gap:2px; pointer-events:none; transform:rotate(8deg); }
  .score span { font-size:clamp(11px, 1.4vw, 16px); opacity:.7; }
  .score b { font:800 clamp(28px, 4.4vw, 56px)/1 ui-sans-serif, system-ui, sans-serif; font-variant-numeric:tabular-nums; }
  .burst { position:absolute; width:0; height:0; pointer-events:none; }
  .burst i { position:absolute; left:-5px; top:-5px; width:10px; height:10px; background:#fff;
             clip-path:polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
             animation:pop .6s cubic-bezier(.15,.8,.3,1) forwards; }
  .burst.bad i { background:#ff9a9a; }
  @keyframes pop { from { transform:rotate(var(--a)) translateY(0) scale(.4); opacity:1; }
                   to { transform:rotate(var(--a)) translateY(calc(-1 * var(--d))) scale(1.1) rotate(90deg); opacity:0; } }
  .pop-label.bad { color:#ffd2d2; text-shadow:0 2px 0 #9a1222; }
  canvas.squint { filter:blur(2.5px); }
  #stats { white-space:pre-line;  position:fixed; left:16px; bottom:calc(10px + env(safe-area-inset-bottom, 0px)); font:11px/1.4 ui-monospace, Menlo, monospace; opacity:.75; font-variant-numeric:tabular-nums; }
</style>
<header>
  <h1>Rookiess · 3 guru e 3 rookie<small>Colpisci i guru (+10), risparmia i rookie (−20)</small></h1>
  <div class="grp" id="modes"><span>Vista</span><button data-mode="hero" aria-pressed="true">Hero</button><button data-mode="studio" aria-pressed="false">Confronto</button></div>
  <div class="grp" id="debug"><span>Debug</span><button data-debug="final" aria-pressed="true">Finale</button><button data-debug="bake">Luce</button><button data-debug="normals">Normali</button><button data-debug="parts">Parti</button><button data-debug="wire">Wireframe</button></div>
  <div class="grp"><button id="fx" aria-pressed="true" title="Effetti leggeri: luce riflessa, grana, ombre, rimbalzi">Effetti</button><button id="blur" aria-pressed="false" title="Sfoca come visto di sfuggita: si distinguono ancora?">Test sfocato</button></div>
  <label class="grp" id="ovl"><span>Figma</span><input id="ovr" type="range" min="0" max="100" value="0" aria-label="Opacità del design Figma sovrapposto"></label>
</header>
<div class="stage"><div class="frame">
  <canvas id="c" data-cursor="pointer" aria-label="Tavolo del gioco con i personaggi"></canvas>
  <img id="ref" alt="" src="data:image/png;base64,__HERO__">
  <div class="labels" id="labels"></div>
  <div class="score" aria-live="polite"><span>Your Points</span><b id="score">0</b></div>
</div></div>
<div id="stats">Preparo i personaggi…</div>
<script type="text/plain" id="worker-src">/*__WORKER__*/</script>
<script>/*__BUNDLE__*/</script>
