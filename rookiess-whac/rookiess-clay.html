<title>Rookiess Clay Test</title>
<style>
  :root { color-scheme:dark; --blue-1:#1530d8; --blue-2:#0b1a9e; --green:#6a9a76; --ink:#fff; --chip:rgba(255,255,255,.14); }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { background:radial-gradient(120% 90% at 50% 20%, var(--blue-1), var(--blue-2)); color:var(--ink);
         font:500 14px/1.3 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif; overflow:hidden; }
  body[data-bg="green"] { background:var(--green); }
  body[data-bg="cream"] { background:#ece7df; --ink:#222; --chip:rgba(0,0,0,.08); }

  canvas:active { cursor:grabbing; }
  header { position:fixed; top:calc(16px + env(safe-area-inset-top, 0px)); left:16px; right:16px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; pointer-events:none; }
  header > * { pointer-events:auto; }
  h1 { font-size:15px; font-weight:600; letter-spacing:.01em; }
  h1 small { display:block; font-weight:400; opacity:.7; font-size:12px; margin-top:2px; }
  .ctl { display:flex; gap:6px; flex-wrap:wrap; }
  button { font:inherit; color:inherit; background:var(--chip); border:0; border-radius:999px; padding:8px 14px; cursor:pointer; }
  button:hover { background:rgba(255,255,255,.24); }
  button.hit { background:#fff; color:#1530d8; font-weight:600; }
</style>

<canvas id="c" aria-label="Personaggio 3D: trascina per ruotarlo, doppio clic per colpirlo" tabindex="0"></canvas>

</header>
