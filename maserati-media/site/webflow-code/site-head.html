<!-- Webflow: Site settings → Custom code → Head code (exported 23 Nov 2026).
     Site footer code = ../cookie-policy/site-footer.html -->
<style>
/* Empty states: no grey box */
.w-dyn-empty,.stl-empty{background-color:transparent;padding:0;color:#666;font-family:var(--mainfont),Arial,sans-serif;font-size:16px;line-height:1.5}
/* Maserati lockup (trident + wordmark) needs more height than the old wordmark */
.navbar{padding-top:22px;padding-bottom:22px}
.navbar .image-2{min-height:60px;max-height:60px}
.footer-logo{height:auto}
.footer .image-2{min-height:64px;max-height:64px}
</style>
<script>
/* Navbar links added as plain links (Media Site): behave like the other navbar links (mobile menu alignment + closes the menu on tap) */
document.addEventListener("DOMContentLoaded",function(){document.querySelectorAll("a.nav-link:not(.w-nav-link)").forEach(function(a){a.classList.add("w-nav-link");a.addEventListener("click",function(){var b=document.querySelector(".w-nav-button.w--open");if(b)setTimeout(function(){b.click();},50);});});});
</script>
<!-- Models row (model pages + Models page): full-width strip under the fixed navbar: the "Maserati Day" page (logo) first, then the models.
     A model shows its render ("Logo" field, Press Kit Manager) with the name below; without a render only the name. -->
<style>
[data-brandbar]{margin-top:96px;background:#fff;border-bottom:1px solid #e6e6ea;padding:12px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
[data-brandbar] + section{margin-top:0 !important}
[data-brandbar]::-webkit-scrollbar{display:none}
[data-brandbar] .w-dyn-items{display:flex;flex-wrap:nowrap;gap:8px;align-items:stretch;width:max-content;min-width:100%;justify-content:center}
[data-brandbar] .w-dyn-item{flex:0 0 auto}
[data-brandbar] .w-dyn-empty{display:none}
[data-bb-link]{display:flex;align-items:center;justify-content:center;height:52px;min-width:96px;padding:0 16px;border-radius:12px;border:1px solid transparent;background:transparent;text-decoration:none;color:#241f21;transition:background .2s,border-color .2s,opacity .2s;opacity:.65}
[data-bb-link]:hover{opacity:1;background:#f5f5f7}
[data-bb-link].is-current{opacity:1;background:#f5f5f7;border-color:#B3121F}
[data-bb-link]:focus-visible{outline:2px solid #131B2C;outline-offset:2px}
[data-bb-logo]{display:block;height:46px;width:auto;max-width:130px;object-fit:contain}
[data-bb-name]{font-size:14px;line-height:1.2;white-space:nowrap}
[data-bb-slug]{display:none}
[data-bb-name]{font-weight:600;letter-spacing:.02em}
[data-bb-link].has-logo [data-bb-name]{font-size:11px}
/* When at least one model has its render, every item is taller: render above, name below */
[data-brandbar].has-renders [data-bb-link]{flex-direction:column;gap:2px;height:82px;min-width:120px}
[data-bb-link]:not(.has-logo) [data-bb-logo]{display:none}
@media (max-width:767px){[data-brandbar]{padding:10px 16px}[data-brandbar] .w-dyn-items{justify-content:flex-start}[data-bb-link]{height:44px;min-width:76px;padding:0 12px}[data-bb-logo]{height:36px;max-width:100px}[data-brandbar].has-renders [data-bb-link]{height:68px;min-width:96px}}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var bar = document.querySelector('[data-brandbar]'); if (!bar) return;
  // Sit right below the fixed navbar, whatever its height on this screen size
  var nav = document.querySelector('.navbar');
  function fit() { if (nav) bar.style.marginTop = Math.max(nav.offsetHeight - 1, 0) + 'px'; }
  fit(); window.addEventListener('resize', fit); window.addEventListener('load', fit);
  var here = location.pathname.replace(/\/+$/, '').split('/').pop();
  bar.querySelectorAll('[data-bb-link]').forEach(function (a) {
    var slugEl = a.querySelector('[data-bb-slug]'), slug = slugEl ? slugEl.textContent.trim() : '';
    var img = a.querySelector('[data-bb-logo]'), src = img ? (img.getAttribute('src') || '') : '';
    // No logo yet (empty image): the brand name is shown instead
    if (img && src && !img.classList.contains('w-dyn-bind-empty') && !/placeholder/i.test(src)) {
      a.classList.add('has-logo'); bar.classList.add('has-renders');
      img.loading = 'eager'; img.removeAttribute('srcset'); img.removeAttribute('sizes');
      if (!img.complete) { img.src = src; }
      img.addEventListener('error', function () { a.classList.remove('has-logo'); });
    }
    var name = a.querySelector('[data-bb-name]'); if (name) a.setAttribute('aria-label', name.textContent.trim());
    if (slug) a.setAttribute('href', '/events/' + slug);
    if (slug && slug === here) { a.classList.add('is-current'); a.setAttribute('aria-current', 'page'); }
  });
  // Keep the selected item in view (again after the renders have loaded: they change the widths)
  function center() { var cur = bar.querySelector('[data-bb-link].is-current'); if (cur && bar.scrollWidth > bar.clientWidth) bar.scrollLeft = cur.offsetLeft - bar.clientWidth / 2 + cur.offsetWidth / 2; }
  center(); window.addEventListener('load', center);
});
</script>
<!-- Embargo notice shown on every page until the embargo ends (no password gate: removed on 25 Nov 2026, see password-gate.html):
     a fixed strip above the navbar; navbar and page move down by its height -->
<style>
#mas-embargo{position:fixed;top:0;left:0;right:0;z-index:1001;height:32px;display:flex;align-items:center;justify-content:center;background:#B3121F;color:#fff;font-family:var(--mainfont),Arial,sans-serif;font-size:13px;line-height:1.2;font-weight:600;letter-spacing:.02em;padding:0 12px;text-align:center}
html.mas-emb body{padding-top:32px}
html.mas-emb .navbar{top:32px}
@media (max-width:479px){#mas-embargo{font-size:12px;letter-spacing:0}}
</style>
<script>
(function(){
  if (Date.now() >= Date.parse("2026-12-10T19:00:00+01:00")) return;
  document.documentElement.classList.add('mas-emb');
  document.addEventListener('DOMContentLoaded', function () {
    if (document.getElementById('mas-embargo')) return;
    var n = document.createElement('div'); n.id = 'mas-embargo'; n.setAttribute('role', 'note');
    n.textContent = 'Contents under embargo until 10/12/2026 7:00 p.m.';
    document.body.insertBefore(n, document.body.firstChild);
  });
})();
</script>
